<!doctype html><html><head><meta charset="utf-8"><title>RemoteKit real WebRTC relay experiment</title><style>body{background:#102d42;color:white;font:16px sans-serif}canvas,video{width:480px}pre{white-space:pre-wrap}</style></head><body><h1>真实 WebRTC · 本机 UDP relay 实验</h1><p>两个独立 PeerConnection，canvas 视频与 DataChannel 均经过 UDP relay。</p><canvas width="640" height="360"></canvas><video autoplay muted playsinline></video><pre id="result">Running…</pre><script>
const token=__RK_TOKEN__;
const post=async(path,body)=>{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-RK-Test-Token':token},body:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw new Error(value.error);return value;};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function gathered(peer){if(peer.iceGatheringState==='complete')return;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('ICE gathering timeout')),10000);peer.addEventListener('icegatheringstatechange',()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timer);resolve();}});});}
async function observations(peer){const stats=await peer.getStats();let pair;stats.forEach(s=>{if(s.type==='transport'&&s.selectedCandidatePairId)pair=stats.get(s.selectedCandidatePairId);});if(!pair)stats.forEach(s=>{if(s.type==='candidate-pair'&&s.nominated&&s.state==='succeeded')pair=s;});const result={};if(pair){result.pair=pair;result.localCandidate=stats.get(pair.localCandidateId);result.remoteCandidate=stats.get(pair.remoteCandidateId);}stats.forEach(s=>{if(s.type==='inbound-rtp'&&(s.kind==='video'||s.mediaType==='video'))result.video=s;});return result;}
(async()=>{const config={bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'},client=new RTCPeerConnection(config),endpoint=new RTCPeerConnection(config),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),video=document.querySelector('video');let frame=0,running=true;
const draw=()=>{if(!running)return;ctx.fillStyle=frame%2?'#163f59':'#17415d';ctx.fillRect(0,0,640,360);ctx.fillStyle='#3bd4bb';ctx.fillRect(frame*7%640,100,100,160);ctx.font='30px sans-serif';ctx.fillStyle='white';ctx.fillText('RemoteKit frame '+frame,20,50);frame++;requestAnimationFrame(draw);};draw();
client.addTransceiver('video',{direction:'recvonly'});const channel=client.createDataChannel('remotekit',{ordered:true});endpoint.ondatachannel=e=>{e.channel.onmessage=event=>e.channel.send(event.data);};client.ontrack=e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);video.play();};
let connectionId;try{await client.setLocalDescription(await client.createOffer());await gathered(client);const offer=await post('/offer',{sdp:client.localDescription.sdp});connectionId=offer.id;await endpoint.setRemoteDescription({type:'offer',sdp:offer.sdp});const track=canvas.captureStream(30).getVideoTracks()[0];endpoint.addTrack(track,new MediaStream([track]));await endpoint.setLocalDescription(await endpoint.createAnswer());await gathered(endpoint);const answer=await post('/answer',{id:offer.id,sdp:endpoint.localDescription.sdp});await client.setRemoteDescription({type:'answer',sdp:answer.sdp});
await new Promise((resolve,reject)=>{if(channel.readyState==='open')return resolve();const timer=setTimeout(()=>reject(new Error('DataChannel connection timeout')),15000);channel.onopen=()=>{clearTimeout(timer);resolve();};});
const frameMetadata={supported:typeof video.requestVideoFrameCallback==='function',callbacks:[]};if(video.requestVideoFrameCallback){const receive=(now,metadata)=>{frameMetadata.callbacks.push({now,keys:Object.keys(metadata),metadata:{...metadata},rtpTimestamp:metadata.rtpTimestamp??null});if(frameMetadata.callbacks.length<5)video.requestVideoFrameCallback(receive);};video.requestVideoFrameCallback(receive);}const rtt=[];for(let n=0;n<20;n++){const start=performance.now();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('DC echo timeout')),2000);channel.onmessage=e=>{if(e.data===String(n)){clearTimeout(timer);rtt.push(performance.now()-start);resolve();}};channel.send(String(n));});}await sleep(2000);
const report={userAgent:navigator.userAgent,requestVideoFrameCallback:frameMetadata,client:await observations(client),endpoint:await observations(endpoint),dataChannelRttMs:rtt,videoWidth:video.videoWidth,videoHeight:video.videoHeight,decodedFrames:video.webkitDecodedFrameCount,generatedCanvasFrames:frame};const result=await post('/results',{id:offer.id,report});window.rkNetworkResult={report,...result};document.querySelector('#result').textContent=JSON.stringify(window.rkNetworkResult,null,2);
}catch(error){window.rkNetworkError=String(error);if(connectionId){try{window.rkNetworkResult=await post('/results',{id:connectionId,report:{error:String(error),client:await observations(client),endpoint:await observations(endpoint),clientSdp:client.localDescription?.sdp,endpointSdp:endpoint.localDescription?.sdp}});}catch{}}document.querySelector('#result').textContent=String(error);}finally{running=false;client.close();endpoint.close();}})();
</script></body></html>

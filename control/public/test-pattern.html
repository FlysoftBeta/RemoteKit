<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RemoteKit streaming diagnostic fixture</title><style>html,body{margin:0;background:#102d42;color:white;font:20px sans-serif}#marker{position:fixed;top:0;left:0;width:256px;height:112px;z-index:5;image-rendering:pixelated}#scene{width:100vw;height:100vh;display:block}#input{position:fixed;left:280px;top:16px;width:260px;height:40px;z-index:4}#label{position:fixed;top:64px;left:280px;z-index:4}#capabilities{position:fixed;bottom:8px;left:12px;max-width:calc(100% - 24px);padding:8px;background:#102d42e8;color:#d5eef0;font:12px/1.4 monospace;white-space:pre-wrap;z-index:4;pointer-events:none}</style></head><body><canvas id="marker" width="256" height="112"></canvas><canvas id="scene"></canvas><textarea id="input" autofocus aria-label="Marker stimulus input" placeholder="RK:123;"></textarea><span id="label"></span><pre id="capabilities"></pre><script type="module">
import {drawMarker} from './marker-codec.js';
const params=new URLSearchParams(location.search),mode=params.get('mode')||'animation',fps=Math.max(1,Math.min(60,Number(params.get('fps')||60))),stopAfter=Number(params.get('stopAfter')||3000);
if(params.get('title'))document.title=params.get('title');
if(params.get('beforeunload')==='1')addEventListener('beforeunload',event=>{event.preventDefault();event.returnValue='RemoteKit close confirmation fixture';});
const marker=document.querySelector('#marker').getContext('2d'),scene=document.querySelector('#scene'),ctx=scene.getContext('2d'),input=document.querySelector('#input');
let frame=0,stimulus=0,start=performance.now(),stopped=false,lastInput='',composition='',touches=0,pointer='',sceneWidth=0,sceneHeight=0,sceneDpr=0;
const renderPeriod=1000/fps,renderTolerance=renderPeriod/2;
// Fixed phase: half-period deadlines with nearest-RAF tolerance admit slots at
// start+n*period, so scheduled renders never exceed elapsed*fps/1000+1.
let nextRender=start+renderTolerance;
function capabilities(){document.querySelector('#capabilities').textContent=JSON.stringify({userAgent:navigator.userAgent,platform:navigator.platform,clientHints:navigator.userAgentData?{platform:navigator.userAgentData.platform,mobile:navigator.userAgentData.mobile,brands:navigator.userAgentData.brands}:null,maxTouchPoints:navigator.maxTouchPoints,DPR:devicePixelRatio,viewport:[innerWidth,innerHeight],userActivation:{hasBeenActive:navigator.userActivation?.hasBeenActive,isActive:navigator.userActivation?.isActive},lastInput,composition,touches,pointer},null,1);}
function activationMarker(){if(params.has('activationMarker')){stimulus=navigator.userActivation?.hasBeenActive?60001:60000;render(performance.now());}capabilities();}
for(const type of ['compositionstart','compositionupdate','compositionend'])input.addEventListener(type,event=>{composition=type+':'+event.data;capabilities();});
addEventListener('touchstart',()=>{touches++;stimulus=(32768+touches)&65535;render(performance.now());activationMarker();});addEventListener('pointerdown',event=>{pointer=event.pointerType+' '+Math.round(event.clientX)+','+Math.round(event.clientY);activationMarker();});addEventListener('keydown',activationMarker);addEventListener('touchend',activationMarker);addEventListener('pointerup',activationMarker);addEventListener('resize',capabilities);capabilities();
input.addEventListener('input',()=>{lastInput=input.value;const matches=[...input.value.matchAll(/RK:(\d+);/g)];if(matches.length){stimulus=Number(matches[matches.length-1][1])&65535;input.value='';render(performance.now());}capabilities();});
function render(now){frame=(frame+1)>>>0;const width=innerWidth,height=innerHeight,dpr=devicePixelRatio;if(width!==sceneWidth||height!==sceneHeight||dpr!==sceneDpr){scene.width=width;scene.height=height;sceneWidth=width;sceneHeight=height;sceneDpr=dpr;}ctx.fillStyle=mode==='change-stop'&&now-start>stopAfter?'#f5e5a4':'#102d42';ctx.fillRect(0,0,scene.width,scene.height);ctx.fillStyle='#39c6bd';const x=(now/5)%(scene.width+200)-200;ctx.fillRect(x,180,200,220);ctx.font='28px sans-serif';for(let y=160;y<scene.height;y+=48){ctx.fillStyle=mode==='change-stop'&&now-start>stopAfter?'#102d42':y%96?'#fff':'#9ccce8';ctx.fillText('RemoteKit · scrolling text · '+frame+' · 0123456789',30,y-(mode==='text'?Math.floor(now/30)%48:0));}drawMarker(marker,frame,Date.now(),stimulus);document.querySelector('#label').style.color=mode==='change-stop'&&now-start>stopAfter?'#102d42':'#fff';document.querySelector('#label').textContent=mode+' · frame '+frame+' · stimulus '+stimulus;}
function tick(now){if(now+renderTolerance>=nextRender){const before=frame;if(mode==='static'){if(!stopped){render(now);stopped=true;}}else if(mode==='change-stop'&&now-start>stopAfter){if(!stopped){render(now);stopped=true;}}else render(now);if(frame!==before)nextRender+=Math.max(1,Math.floor((now-nextRender)/renderPeriod)+1)*renderPeriod;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose = "2026.09.00"
icons = "1.7.8"
webkit = "1.18.0"
activity = "1.13.0"
lifecycle = "2.11.0"
core = "1.19.1"
serialization = "1.12.0"
coroutines = "1.11.0"
bc = "1.86"
mail = "1.6.8"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "icons" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core = { module = "androidx.core:core-ktx", version.ref = "core" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
bc = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bc" }
mail = { module = "com.sun.mail:android-mail", version.ref = "mail" }
activation = { module = "com.sun.mail:android-activation", version.ref = "mail" }
junit = { module = "junit:junit", version.ref = "junit" }

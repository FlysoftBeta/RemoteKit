<!doctype html><meta charset="utf-8"><title>RemoteKit input fixture</title>
<style>body{font:15px system-ui;margin:18px;background:#eef3f9;color:#17304b}textarea{box-sizing:border-box;width:100%;height:75px;font:20px system-ui}pre{white-space:pre-wrap;font-size:11px}iframe{width:100%;height:100px;border:1px solid #89a}#touch{padding:16px;background:#cde4fc;touch-action:none}h2{font-size:19px}</style>
<h2>RemoteKit · input / isolation</h2>
<textarea id="editor" placeholder="中文 IME · emoji · keyboard"></textarea>
<div id="touch">Mouse / touch target <span id="position"></span></div>
<pre id="events">Ready</pre><iframe id="frame"></iframe><pre id="identity"></pre>
<script>
window.fixtureEvents=[];
const log=e=>{fixtureEvents.push({type:e.type,data:e.data??null,value:editor.value});events.textContent=JSON.stringify(fixtureEvents.slice(-4),null,1)};
for(const type of ['beforeinput','input','compositionstart','compositionupdate','compositionend','keydown','keyup'])editor.addEventListener(type,log);
for(const type of ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend'])touch.addEventListener(type,e=>{position.textContent=e.type;log(e)});
frame.src=location.protocol==='file:'?'frame.html':`http://localhost:${location.port}/frame.html`;
(async()=>{identity.textContent=JSON.stringify({ua:navigator.userAgent,brands:navigator.userAgentData?.brands,high:await navigator.userAgentData?.getHighEntropyValues(['architecture','bitness','platformVersion','fullVersionList']),chrome:Object.keys(window.chrome??{}),csi:chrome.csi(),loadTimes:chrome.loadTimes()},null,1)})();
</script>

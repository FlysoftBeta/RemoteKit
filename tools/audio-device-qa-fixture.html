<!doctype html>
<meta charset="utf-8">
<title>audio-device-probe loading</title>
<button id="sound" style="width:200px;height:80px">Start playback</button>
<pre id="status"></pre>
<script>
// Served on loopback by audio-files-qa-server; never requests microphone access.
const events = [];
function report(type, data = {}) {
  const event = {type, at: performance.now(), ...data};
  events.push(event);
  document.getElementById('status').textContent = JSON.stringify(events, null, 2);
  return fetch('/event', {method: 'POST', body: JSON.stringify(event)});
}
navigator.mediaDevices.addEventListener('devicechange', () => report('devicechange'));
async function enumerate(index) {
  const devices = await navigator.mediaDevices.enumerateDevices();
  await report('audio-device-enumerated', {index, devices: devices.map(({kind, label}) => ({kind, label}))});
}
let context;
sound.onclick = async () => {
  context ??= new AudioContext({sampleRate: 48000});
  await context.resume();
  if (!window.started) {
    window.started = true;
    const merger = context.createChannelMerger(2);
    [440, 880].forEach((frequency, channel) => {
      const oscillator = context.createOscillator(), gain = context.createGain();
      oscillator.frequency.value = frequency;
      gain.gain.value = .08;
      oscillator.connect(gain).connect(merger, 0, channel);
      oscillator.start();
    });
    merger.connect(context.destination);
  }
  await enumerate('playing');
  await report('audio-device-playback', {state: context.state, sampleRate: context.sampleRate});
};
(async () => {
  // The first request must use normal startup placement, before playback opens.
  for (let index = 0; index < 10; ++index) {
    await enumerate(index);
    await new Promise(resolve => setTimeout(resolve, 1000));
  }
  document.title = 'audio-device-probe passed';
  await report('audio-device-probe-passed');
})().catch(async error => {
  document.title = 'audio-device-probe failed';
  await report('audio-device-probe-failed', {error: String(error)});
});
</script>

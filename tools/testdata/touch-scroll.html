<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>RemoteKit touch source clock fixture</title>
<style>
html,body{margin:0;font:16px system-ui}body{height:6000px;background:repeating-linear-gradient(#edf6ff 0px,#c4dcf4 98px,#486b8d 100px)}
header{position:fixed;left:10px;top:8px;pointer-events:none;background:white;padding:8px;z-index:10}
.box{position:fixed;width:240px;height:260px;border:3px solid #245;box-sizing:border-box;background:#fff;overflow:auto}
#nested{left:380px;top:45px}#none{left:650px;top:45px;touch-action:none;background:#e7ffd8}
#blocked{left:650px;top:335px;background:#ffe0db}iframe{left:380px;top:335px}.tall{height:2400px;background:repeating-linear-gradient(#fff 0px,#c4dece 48px,#395 50px)}
</style>
<header>Touch clock / native page semantics <span id="status"></span></header>
<div id="nested" class="box"><div class="tall">Nested scroll</div></div>
<div id="none" class="box">touch-action:none drawing target</div>
<div id="blocked" class="box"><div class="tall">touchmove preventDefault target</div></div>
<iframe class="box" id="child"></iframe>
<script>
(()=>{
const params=new URL(location).searchParams, id=params.get('case')||'unassigned', child=params.has('child');
if(child){document.querySelectorAll('.box').forEach(e=>e.remove());document.querySelector('header').textContent='Cross-origin iframe scroll';}
else document.querySelector('iframe').src='http://localhost:33282/fixture?child=1&case='+encodeURIComponent(id);
const events=[],scroll=[],counts={};let until=0,pending=false;
const read=()=>({root:scrollY,nested:document.querySelector('#nested')?.scrollTop??0,none:document.querySelector('#none')?.scrollTop??0,blocked:document.querySelector('#blocked')?.scrollTop??0});
const base=()=>({id,child,origin:location.origin,dpr:devicePixelRatio,width:innerWidth,height:innerHeight,at:performance.now(),wall:Date.now(),positions:read(),counts,events,scroll});
const post=()=>fetch('http://127.0.0.1:33282/telemetry',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(base())}).catch(()=>{});
function frame(){const now=performance.now();scroll.push({at:now,...read()});if(scroll.length>300)scroll.shift();if(now<until)requestAnimationFrame(frame);else{pending=false;post();}}
for(const type of ['pointerdown','pointermove','pointerup','pointercancel','touchstart','touchmove','touchend','touchcancel'])document.addEventListener(type,e=>{
counts[type]=(counts[type]||0)+1;const t=e.changedTouches?.[0]??e;events.push({type,target:e.target.id||e.target.tagName,ts:e.timeStamp,dispatch:performance.now(),x:t.clientX,y:t.clientY,touches:e.touches?.length});if(events.length>300)events.shift();
until=performance.now()+2200;if(!pending){pending=true;requestAnimationFrame(frame);}if(type==='touchend'||type==='touchcancel'){post();setTimeout(post,2500);}
},{capture:true,passive:true});
document.querySelector('#blocked')?.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.querySelector('#none')?.addEventListener('pointermove',e=>{if(e.buttons)document.querySelector('#none').textContent='Drawing '+Math.round(e.clientX)+','+Math.round(e.clientY);});
const label=document.querySelector('#status');if(label)label.textContent=id;post();setTimeout(post,1000);
})();
</script>

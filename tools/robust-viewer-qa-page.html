<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Robust Viewer fixture</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px system-ui;background:#e4efff}header{position:sticky;top:0;background:#173b63;color:white;padding:12px;z-index:1}main{padding:20px}button,input,textarea{font:inherit;min-height:40px;margin:4px}textarea{display:block;width:320px;height:85px}#blank{height:60px;background:#bde}#nested{width:75%;height:200px;overflow:auto;border:4px solid #d75;background:white}#inner{height:1200px;padding:12px;background:linear-gradient(white,#9dcfff)}.row{height:220px;border-bottom:2px solid #345;padding:20px}</style>
<header id="header">Robust Viewer fixture <span id="status"></span></header><main>
<input id="text" placeholder="Remote input"><textarea id="area" placeholder="Remote textarea"></textarea>
<div id="blank" tabindex="-1">Blank: clicking here must blur the remote editor</div>
<button id="popup">Real about:blank popup</button><button id="guard">Enable beforeunload</button>
<button id="tone">Start stereo tone</button><button id="silence">Stop tone</button>
<button id="single">Single file</button><button id="multiple">Multiple files</button><button id="later">Read selected again</button>
<input hidden id="one" type="file"><input hidden id="many" type="file" multiple>
<div id="nested"><div id="inner">Nested scroll target</div></div></main>
<script>
const params=new URLSearchParams(location.search),label=params.get('label')||'A',documentId=Math.random().toString(36).slice(2);let serial=0,held=[],guard=false;
document.title='Robust '+label;document.querySelector('#header').firstChild.textContent='Robust '+label+' · ';
const report=(type,data={})=>fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,label,documentId,serial:++serial,at:performance.now(),href:location.href,...data})}).catch(()=>{});
const snapshot=()=>({scrollY,nested:document.querySelector('#nested').scrollTop,width:innerWidth,height:innerHeight,dpr:devicePixelRatio,active:document.activeElement?.id,text:document.querySelector('#text').value,area:document.querySelector('#area').value,rects:Object.fromEntries(['header','text','area','blank','popup','tone','silence','nested'].map(id=>{const r=document.getElementById(id).getBoundingClientRect();return[id,{x:r.x,y:r.y,width:r.width,height:r.height}]}))});
for(let n=0;n<18;n++){const row=document.createElement('div');row.className='row';row.textContent='Page row '+n;document.body.append(row)}
for(const type of ['pointerdown','pointerup','wheel','focusin','focusout','keydown','keyup','beforeinput','input','compositionstart','compositionupdate','compositionend'])document.addEventListener(type,event=>report('input',{kind:type,target:event.target.id,key:event.key,inputType:event.inputType,data:event.data,x:event.clientX,y:event.clientY,deltaY:event.deltaY,...snapshot()}),{capture:true});
let timer;const scroll=()=>{document.querySelector('#status').textContent='page '+Math.round(scrollY)+' / nested '+document.querySelector('#nested').scrollTop;clearTimeout(timer);timer=setTimeout(()=>report('scroll',snapshot()),80)};addEventListener('scroll',scroll);document.querySelector('#nested').addEventListener('scroll',scroll);onresize=()=>report('geometry',snapshot());
document.querySelector('#blank').onclick=()=>document.activeElement?.blur();
document.querySelector('#popup').onclick=()=>{const popup=open('about:blank');if(popup){popup.document.write('<title>Real blank popup</title><h1>REAL POPUP '+label+'</h1>');report('popup',{opened:true,openerMatches:popup.opener===window,url:popup.location.href,title:popup.document.title})}else report('popup',{opened:false})};
document.querySelector('#guard').onclick=()=>{guard=!guard;report('guard',{enabled:guard})};onbeforeunload=event=>{if(guard){event.preventDefault();event.returnValue='fixture guard';return 'fixture guard'}};
let audio;
document.querySelector('#tone').onclick=async()=>{if(!audio){const context=new AudioContext(),merge=context.createChannelMerger(2),oscillators=[440,880].map((frequency,index)=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.frequency.value=frequency;gain.gain.value=.08;oscillator.connect(gain);gain.connect(merge,0,index);oscillator.start();return oscillator});merge.connect(context.destination);audio={context,oscillators}}await audio.context.resume();report('tone',{state:audio.context.state,frequencies:[440,880]})};
document.querySelector('#silence').onclick=async()=>{if(audio)await audio.context.suspend();report('tone',{state:audio?.context.state??'absent'})};
document.querySelector('#single').onclick=()=>document.querySelector('#one').click();document.querySelector('#multiple').onclick=()=>document.querySelector('#many').click();
const fileData=async()=>Promise.all(held.map(async file=>{const bytes=new Uint8Array(await file.arrayBuffer());let hash=2166136261;for(const byte of bytes)hash=Math.imul(hash^byte,16777619)>>>0;return{name:file.name,size:bytes.length,fnv1a:hash.toString(16).padStart(8,'0'),bytes:bytes.length<=128?Array.from(bytes):undefined}}));
for(const input of [document.querySelector('#one'),document.querySelector('#many')]){input.onchange=async()=>{held=Array.from(input.files);report('selected',{files:await fileData()});input.value=''};input.addEventListener('cancel',()=>report('file-cancel'))}
document.querySelector('#later').onclick=async()=>{history.pushState({},'','/?label='+encodeURIComponent(label)+'&read=delayed');report('delayed',{files:await fileData()})};
report('ready',snapshot());
</script>

<!doctype html>
<meta charset="utf-8">
<title>RemoteKit keyboard viewport fixture</title>
<style>
  body { margin: 0; background: #dae6f0; font: 16px Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; padding: 16px; background: #16365c; color: white; }
  label { display: inline-flex; flex-direction: column; margin: 4px; }
  button, input { padding: 8px; font: inherit; }
  #contacts { width: 240px; height: 96px; margin: 8px; background: #ecf5ff; touch-action: none; }
  #scroll { height: 180vh; background: repeating-linear-gradient(35deg, #184469 0 25px, #82b4d8 25px 50px, #ecf5ff 50px 75px); }
</style>
<header>
  <button id="tl">Leave editor</button>
  <label>Field A<input id="text"></label>
  <label>Field B<input id="second"></label>
  <label>Field C<input id="third"></label>
</header>
<div id="contacts">Touch contacts</div>
<div id="scroll"></div>
<script>
  const fields = ['text', 'second', 'third'].map(id => document.getElementById(id));
  const contacts = document.getElementById('contacts');
  const targets = [document.getElementById('tl'), ...fields, contacts, document.getElementById('scroll')];
  const documentId = String(performance.timeOrigin);
  let resizeCount = 0;
  const geometry = () => Object.fromEntries(targets.map(target => [target.id, target.getBoundingClientRect().toJSON()]));
  function report(type, details) {
    const [text, second, third] = fields.map(field => field.value);
    return fetch('/event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, documentId, resizeCount, scrollY, width: innerWidth, height: innerHeight,
        geometry: geometry(), text, second, third, ...details }),
    }).catch(() => {});
  }
  for (const field of fields) {
    for (const type of ['input', 'compositionstart', 'compositionupdate', 'compositionend', 'focus', 'blur']) {
      field.addEventListener(type, event => report(type === 'input' ? field.id : type, {
        field: field.id,
        data: event.data,
        selection: [field.selectionStart, field.selectionEnd],
      }));
    }
  }
  addEventListener('resize', () => { resizeCount++; report('resize'); });
  document.getElementById('tl').addEventListener('click', event => report('click', {trusted:event.isTrusted}));
  for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
    contacts.addEventListener(type, event => report(type, {
      active: Array.from(event.touches, point => point.identifier),
      changed: Array.from(event.changedTouches, point => point.identifier),
      trusted: event.isTrusted,
    }), {passive:true});
  }
  let scrollReported = false;
  addEventListener('scroll', () => {
    if (!scrollReported && scrollY > 30) {
      scrollReported = true;
      report('scroll');
    }
  }, {passive:true});
  report('ready');
</script>
